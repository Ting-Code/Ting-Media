# 只要建仓级别回调；拉升明显离箱后再缩量回落 = 出货回调，剔除
name: v1_accum_shrink_hold

tdx:
  vipdoc: "D:/app/tdx/vipdoc"
  max_bars: 250

universe:
  boards: [main, chinext, star, bse]
  exclude_st: true
  exclude_index: true

filters:
  - id: accumulation_shrink_hold
    params:
      box_min_days: 20
      box_max_days: 55
      box_width_min: 0.07
      box_width_max: 0.25
      min_up_dn_vol: 1.05
      min_swings: 1
      swing_reset_pos: 0.70
      ignite_vol_ratio: 2.0
      box_vs_quiet: 1.05
      quiet_days: 20
      box_end_gap: 20
      peak_lookback: 35
      lift_days: 10
      pullback_days: 5
      max_pull_vol_ratio: 0.60
      min_off_peak: 0.03
      cost_slack: 0.05
      max_above_box: 0.08
      # 现价须仍在箱内或略贴箱（建仓回调）；已远离箱=拉升段
      max_close_above_box: 0.02
      # 峰值相对箱顶：超过即视为拉升已发生，其后缩量回落无价值
      max_peak_above_box: 0.12
      min_peak_above_box: 0.0
      min_box_pos: 0.50
      min_dist_cost: 0.0
      max_dist_cost: 0.12
      near_high_pct: 0.95
      exclude_vol_vs_lift: 0.90
      max_peak_drawdown: 0.18
      # 峰值已越箱较多 + 又从峰回撤 = 出货回调
      climax_left_box: 0.10
      climax_pull_dd: 0.08
      reject_downtrend_relay: true
      ma60_slope_lookback: 10
      ma60_slope_tol: 0.005
      reject_break_box_low: true

      # Path B：箱内建仓中（覆盖五洲式中段，不只起爆前一天）
      enable_inbox_path: true
      inbox_box_max_days: 70
      inbox_box_width_max: 0.45
      inbox_min_up_dn_vol: 1.20
      inbox_max_vol_vs_box: 0.78
      inbox_min_box_pos: 0.35
      inbox_max_box_pos: 0.92
      inbox_min_dist_cost: -0.03
      inbox_max_dist_cost: 0.12
      inbox_max_peak_drawdown: 0.28
      inbox_box_tail_gap: 3
      inbox_box_vs_quiet: 1.05
      inbox_min_swings: 1

rank:
  by: [amount_yi, pct_chg_5d]
  ascending: [false, false]

output:
  top: 200
