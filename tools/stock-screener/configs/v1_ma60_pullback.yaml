# 缩量跌 → 异动上 MA60 → 回调缩量不破 MA60（纯K线，暂不含 KDJ）
name: v1_ma60_pullback

tdx:
  vipdoc: "D:/app/tdx/vipdoc"
  max_bars: 180

universe:
  boards: [main, chinext, star, bse]
  exclude_st: true
  exclude_index: true

filters:
  - id: ma60_shrink_pullback
    params:
      ma: 60
      decline_days: 15
      breakout_lookback: 20
      min_breakout_pct: 3.0
      min_breakout_vol_ratio: 1.5
      max_pullback_vol_ratio: 0.8
      pullback_days: 3
      # kdj_j_max: 0   # 需要 J<0 时再打开

rank:
  by: [amount_yi, pct_chg_5d]
  ascending: [false, false]

output:
  top: 200
