<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>{{TITLE}}</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<main id="app" class="deck" aria-live="polite"></main>

<script src="app.js"></script>

</html>
